# Cloud Build configuration for InstaFlow
# Builds and updates API and Worker images on Cloud Run
# 
# NOTE: Infrastructure settings (Env Vars, Secrets, Memory, CPU) 
# are managed exclusively by Terraform to prevent configuration drift.

steps:
  # 1. Build API image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/instaflow-api:latest'
      - '-f'
      - 'instaflow-backend/Dockerfile.api'
      - 'instaflow-backend/.'

  # 2. Build Worker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/instaflow-worker:latest'
      - '-f'
      - 'instaflow-backend/Dockerfile.worker'
      - 'instaflow-backend/.'

  # 3. Push API image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/instaflow-api:latest']

  # 4. Push Worker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/instaflow-worker:latest']

  # 5. Update API to use new image (preserves existing env/secrets)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'instaflow-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/instaflow-api:latest'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'

  # 6. Update Worker to use new image (preserves existing env/secrets)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'instaflow-worker'
      - '--image'
      - 'gcr.io/$PROJECT_ID/instaflow-worker:latest'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'

  # 7. Install and Build Webhook Function
  - name: 'node:20'
    entrypoint: npm
    dir: 'instaflow-backend/gcp/webhook-function'
    args: ['install']
  
  - name: 'node:20'
    entrypoint: npm
    dir: 'instaflow-backend/gcp/webhook-function'
    args: ['run', 'build']

  # 8. Deploy Webhook Function
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    dir: 'instaflow-backend/gcp/webhook-function'
    args:
      - 'functions'
      - 'deploy'
      - 'instagram-webhook'
      - '--gen2'
      - '--runtime'
      - 'nodejs20'
      - '--trigger-http'
      - '--allow-unauthenticated'
      - '--entry-point'
      - 'instagramWebhook'
      - '--region'
      - 'asia-south1'
      - '--set-env-vars'
      - 'GCP_PROJECT_ID=$PROJECT_ID,PUBSUB_TOPIC=instagram-webhooks'
      - '--update-secrets'
      - 'INSTAGRAM_VERIFY_TOKEN=IG_WEBHOOK_VERIFY_TOKEN:latest'
      
  # 9. Update VM-based Worker
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud compute ssh instaflow-worker-vm --zone=asia-south1-a --command=" \
          gcloud auth configure-docker gcr.io --quiet && \
          docker pull gcr.io/$PROJECT_ID/instaflow-worker:latest && \
          docker stop instaflow-worker || true && \
          docker rm instaflow-worker || true && \
          docker run -d \
            --name instaflow-worker \
            --restart always \
            -e RUN_MODE=local \
            -e NODE_ENV=production \
            -e REDIS_HOST=$(gcloud compute instances describe instaflow-worker-vm --zone=asia-south1-a --format='get(networkInterfaces[0].networkIP)') \
            -e REDIS_PORT=6379 \
            -e GCP_PROJECT_ID=$PROJECT_ID \
            -e DATABASE_URL=\"\$(gcloud secrets versions access latest --secret=DATABASE_URL)\" \
            -e JWT_SECRET=\"\$(gcloud secrets versions access latest --secret=JWT_SECRET)\" \
            -e JWT_REFRESH_SECRET=\"\$(gcloud secrets versions access latest --secret=JWT_REFRESH_SECRET)\" \
            -e MASTER_ENCRYPTION_KEY=\"\$(gcloud secrets versions access latest --secret=MASTER_ENCRYPTION_KEY)\" \
            gcr.io/$PROJECT_ID/instaflow-worker:latest"

images:
  - 'gcr.io/$PROJECT_ID/instaflow-api:latest'
  - 'gcr.io/$PROJECT_ID/instaflow-worker:latest'

options:
  logging: CLOUD_LOGGING_ONLY
